# Kind cluster configuration for medik8s HA development
# Creates 3 control-plane + 3 worker nodes.
# Use with: make dev-setup KIND_HA=true
# Useful for testing SNR control-plane peer health checks.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
    # Prevent SNR from rebooting the shared host kernel; the watcher restarts containers.
    extraMounts: &rebootMasks
      - hostPath: /dev/null
        containerPath: /proc/sysrq-trigger
        readOnly: true
      - hostPath: /dev/null
        containerPath: /dev/watchdog
        readOnly: true
      - hostPath: /dev/null
        containerPath: /dev/watchdog0
        readOnly: true
  - role: control-plane
    extraMounts: *rebootMasks
  - role: control-plane
    extraMounts: *rebootMasks
  - role: worker
    extraMounts: *rebootMasks
  - role: worker
    extraMounts: *rebootMasks
  - role: worker
    extraMounts: *rebootMasks
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
