# Kind cluster configuration for medik8s development
# Creates 1 control-plane + 2 worker nodes (default).
# SNR requires 2+ workers for peer health checks.
# Use KIND_EXTRA_WORKERS=true for 3 workers (needed for storm simulation).
# Single CP is sufficient for development; multi-CP etcd quorum testing
# requires a real OpenShift cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
    # Prevent SNR from rebooting the shared host kernel; the watcher restarts containers.
    extraMounts: &rebootMasks
      - hostPath: /dev/null
        containerPath: /proc/sysrq-trigger
        readOnly: true
      - hostPath: /dev/null
        containerPath: /dev/watchdog
        readOnly: true
      - hostPath: /dev/null
        containerPath: /dev/watchdog0
        readOnly: true
  - role: worker
    extraMounts: *rebootMasks
  - role: worker
    extraMounts: *rebootMasks
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
